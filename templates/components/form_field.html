<div class="form-field{% if field.errors %} form-field-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.errors %}
    <ul class="errorlist" id="{{ field.auto_id }}_error">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
  {{ field }}
</div>
