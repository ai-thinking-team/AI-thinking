services:
  - type: web
    name: ai-thinking
    runtime: python
    region: singapore
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TRUST_PROXY_HEADERS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: sqlite
      - key: EMAIL_ENABLED
        value: "false"
      - key: CODE_RUNNER_REQUIRED
        value: "false"
      - key: CODE_RUNNER_AUTOSTART
        value: "false"
      - key: CODE_RUNNER_TIMEOUT_SECONDS
        value: "40"
      - key: GROQ_API_KEY
        sync: false
