<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #f6f5fb;
    --surface: #ffffff;
    --ink: #211f3d;
    --muted: #6d6a8c;
    --border: #e6e3f5;
    --primary: #5b45e0;
    --primary-dark: #4433b8;
    --primary-soft: #efebfd;
    --success: #0ea672;
    --success-soft: #e3f9ef;
    --warning: #b5790a;
    --warning-soft: #fff2dc;
    --danger: #c23a3a;
    --danger-soft: #fdeaea;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(33, 31, 61, 0.06), 0 8px 24px -12px rgba(33, 31, 61, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 480px at 8% -8%, #efeafd 0%, transparent 60%),
      radial-gradient(900px 420px at 100% 0%, #e4f8f0 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    line-height: 1.6;
  }

  a { color: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem clamp(1.25rem, 4vw, 3rem);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    font-weight: 800;
    font-size: 1.05rem;
    text-decoration: none;
    color: var(--ink);
  }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #8a3ff0);
    display: inline-flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: .85rem;
    box-shadow: 0 4px 10px -4px rgba(91, 69, 224, .6);
  }
  .top-link {
    font-size: .9rem;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
  }
  .top-link:hover { color: var(--primary); }

  .lang-switch { display: inline-flex; align-items: center; gap: .4rem; }
  .lang-switch form { margin: 0; display: inline; }
  .lang-link {
    background: none; border: none; padding: 0; font: inherit; cursor: pointer;
    font-size: .85rem; font-weight: 600; color: var(--muted);
  }
  .lang-link:hover { color: var(--primary); }
  .lang-link.active { color: var(--primary-dark); font-weight: 800; }
  .lang-sep { color: var(--border); font-size: .8rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    border: none;
    border-radius: 999px;
    padding: .85rem 1.6rem;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px -10px rgba(91, 69, 224, .7); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-quiet { background: transparent; color: var(--muted); padding: .6rem 1rem; }
  .btn-quiet:hover { color: var(--ink); }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    padding: .3rem .7rem;
    border-radius: 999px;
    font-size: .76rem;
    font-weight: 700;
    letter-spacing: .01em;
  }
  .pill-success { background: var(--success-soft); color: var(--success); }
  .pill-warning { background: var(--warning-soft); color: var(--warning); }
  .pill-muted { background: var(--primary-soft); color: var(--primary); }

  .status-banner {
    border-radius: var(--radius-md);
    padding: .95rem 1.15rem;
    font-size: .92rem;
    font-weight: 600;
    margin: 0 0 1.1rem;
  }
  .status-banner.success { background: var(--success-soft); color: #0a7a53; }
  .status-banner.info { background: var(--primary-soft); color: var(--primary-dark); }
  .status-banner.warning { background: var(--warning-soft); color: #8a5a08; }
  .status-banner.error { background: var(--danger-soft); color: var(--danger); }

  textarea, input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: .95rem;
    padding: .8rem .95rem;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    resize: vertical;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea:focus, input[type="text"]:focus, button:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
</style>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
    },
  };
</script>
