{% load i18n %}
<div class="lang-switch">
  <form action="{% url 'set_language' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="ja" class="lang-link{% if LANGUAGE_CODE == 'ja' %} active{% endif %}">日本語</button>
  </form>
  <span class="lang-sep">|</span>
  <form action="{% url 'set_language' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="en" class="lang-link{% if LANGUAGE_CODE == 'en' %} active{% endif %}">English</button>
  </form>
</div>
